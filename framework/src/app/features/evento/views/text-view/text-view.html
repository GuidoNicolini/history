<div class="row justify-content-center margen-superior">
  <div class="col">
    <div class="card mb-3"  [ngClass]=cube.styleClass >
      <div class="row g-0">
        <div class="col-md-1 align-content-center">
          <img [src]=avatar class="img-fluid rounded-start" >
        </div>
        <div class="col-md-11">
          <div class="card-body">
            <h5 class="card-title">{{ name }}</h5>
            <p class="card-text">{{ formattedText }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
