<div class="container-fluid">
  <div class="row text-center">
    <div class="col">
      <h1>{{ location.name }}</h1>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
    @for (location of subLocations; track location.id) {
      <app-card [location] = "location"></app-card>
    }
  </div>

</div>
