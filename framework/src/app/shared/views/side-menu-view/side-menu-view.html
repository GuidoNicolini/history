

<div class="side-menu-container">
  <!-- Game Title -->
  <div class="side-menu-header">
    <div class="game-title-wrapper" [ngClass]="'vip-' + vipLevel">
      <h1 class="game-title">Happy City</h1>
      @if (vipLevel > 0) {
        <div class="vip-badge-container">
          <span class="vip-badge">{{ vipName }}</span>
        </div>
      }
    </div>
  </div>

  <!-- Widgets Section (Clock, Energy, Money) -->
  <div class="widgets-section">
    <app-clock></app-clock>
    <app-hero-energy></app-hero-energy>
    <app-hero-money></app-hero-money>
  </div>

  <div>
    <app-stats-view></app-stats-view>
  </div>

  <!-- Progress Section -->
  <div class="progress-section">
    <app-progress></app-progress>
  </div>

  <!-- Patreon Banner (Anchored at the bottom) -->
  <div class="patreon-section" [class.show]="showPatreonImage">
    <div class="patreon-container" [class.show]="showPatreonImage">
      <a href="https://www.patreon.com/HappyCityDev" target="_blank" rel="noopener noreferrer">
        <img src="assets/img/others/patreon.jpeg" class="patreon-image img-fluid">
      </a>
    </div>
  </div>
</div>
