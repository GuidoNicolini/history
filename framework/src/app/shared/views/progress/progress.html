<div class="progress-container p-3 mb-3 text-start">
  <div class="d-flex justify-content-between align-items-center progress-header" (click)="toggleExpand()">
    <span class="header-title">
      <i class="bi bi-trophy-fill text-warning me-2 animate-bounce"></i>
      Event Progress
    </span>
    <div class="d-flex align-items-center">
      <span class="overall-badge text-white px-2 py-0.5 rounded-pill text-xs me-2">
        {{ overallProgress().percentage }}%
      </span>
      <i class="bi text-white" [class.bi-chevron-up]="isExpanded" [class.bi-chevron-down]="!isExpanded"></i>
    </div>
  </div>

  <div class="progress-content" [class.expanded]="isExpanded">
    <hr class="my-2 border-secondary">

    <!-- Overall Summary -->
    <div class="overall-summary mb-3 p-2 rounded text-center">
      <div class="overall-label text-xs uppercase tracking-wider mb-1" style="font-size: 0.85rem;">Total Completed</div>
      <div class="h5 mb-1 font-bold text-white">
        {{ overallProgress().seen }} / {{ overallProgress().total }}
      </div>
      <div class="progress custom-progress-main" style="height: 8px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" 
             [style.width.%]="overallProgress().percentage" 
             [attr.aria-valuenow]="overallProgress().percentage" 
             aria-valuemin="0" 
             aria-valuemax="100"></div>
      </div>
    </div>

    <!-- Tiers List -->
    <div class="tier-list">
      <div *ngFor="let tier of tiersProgress()" class="tier-item mb-2 p-2 rounded">
        <div class="d-flex justify-content-between align-items-center mb-1" style="font-size: 0.8rem;">
          <span class="tier-name font-semibold">{{ tier.name }}</span>
          <span class="tier-ratio">{{ tier.seen }}/{{ tier.total }}</span>
        </div>
        <div class="d-flex align-items-center">
          <div class="progress custom-progress-tier flex-grow-1" style="height: 6px;">
            <div class="progress-bar" role="progressbar" 
                 [ngClass]="getTierBarClass(tier.name)"
                 [style.width.%]="tier.percentage" 
                 [attr.aria-valuenow]="tier.percentage" 
                 aria-valuemin="0" 
                 aria-valuemax="100"></div>
          </div>
          <span class="tier-percentage text-xs ms-2 text-white font-medium" style="min-width: 30px; text-align: right; font-size: 0.75rem;">
            {{ tier.percentage }}%
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
